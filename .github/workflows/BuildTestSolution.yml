name: Build and Test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore DDDToolkit.slnx

      - name: Build
        run: dotnet build DDDToolkit.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test DDDToolkit.slnx --no-build --configuration Release --verbosity normal
