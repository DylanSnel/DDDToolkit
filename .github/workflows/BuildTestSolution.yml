name: Build and Test

# A pull request from this repository would otherwise be built twice, once for the push to the branch
# and once for the pull request itself. Branch pushes are therefore limited to main; every other branch
# is covered by its pull request.
on:
  push:
    branches: [main]
  pull_request:

# A new commit makes the run for the previous one pointless, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore DDDToolkit.slnx

      - name: Build
        run: dotnet build DDDToolkit.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test DDDToolkit.slnx --no-build --configuration Release --verbosity normal

      # Packaging breaks in ways a build cannot show. An analyzer project whose assembly ships in
      # analyzers/dotnet/cs has no lib/ content, so an inherited IncludeSymbols made pack fail with
      # NU5017 while the build stayed green. Packing here means the release workflow is never the
      # first thing to try it.
      - name: Pack
        run: |
          for csproj in $(find ./Source -name '*.csproj'); do
            dotnet pack "$csproj" --configuration Release --no-build --output nupkgs -p:PackageVersion=0.0.0-ci
          done
