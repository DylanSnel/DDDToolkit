name: Build and Test

# A pull request from this repository would otherwise be built twice, once for the push to the branch
# and once for the pull request itself. Branch pushes are therefore limited to main; every other branch
# is covered by its pull request.
on:
  push:
    branches: [main]
  pull_request:

# A new commit makes the run for the previous one pointless, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # A container-backed test that skips itself is honest on a laptop and a lie on a runner, where
      # Docker is always there: the run reports green having proven nothing. This makes every such
      # skip a failure that names what could not be started. The pgmq suite is what it catches here;
      # PostgreSQL and SQL Server have their own workflow.
      DDDTOOLKIT_REQUIRE_CONTAINERS: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore DDDToolkit.slnx

      - name: Build
        run: dotnet build DDDToolkit.slnx --no-restore --configuration Release

      # Everything except the provider suite, which the Provider Tests workflow runs beside this one.
      # Excluding it here is what keeps this job about two minutes: a SQL Server image is roughly
      # 700 MB to pull and the better part of a minute to become ready, and paying that on every push
      # to find out whether a generator still compiles is the wrong trade.
      #
      # The filter reads as "not these two traits". A test with no Provider trait at all satisfies
      # both clauses, which is how every other project in the solution still runs.
      - name: Test
        run: dotnet test DDDToolkit.slnx --no-build --configuration Release --verbosity normal --filter "Provider!=Postgres&Provider!=SqlServer"

      # Packaging breaks in ways a build cannot show. An analyzer project whose assembly ships in
      # analyzers/dotnet/cs has no lib/ content, so an inherited IncludeSymbols made pack fail with
      # NU5017 while the build stayed green. Packing here means the release workflow is never the
      # first thing to try it.
      - name: Pack
        run: |
          for csproj in $(find ./Source -name '*.csproj'); do
            dotnet pack "$csproj" --configuration Release --no-build --output nupkgs -p:PackageVersion=0.0.0-ci
          done

      # A consumer gets the generators from analyzers/dotnet/cs and DDD_Module from
      # build/DDDToolkit.props. Neither path is used inside this repository, where everything is a
      # ProjectReference and DDD_Module comes from Directory.Build.props, so the packaging contract is
      # untested by everything above. This builds Examples/DDDToolkit.NugetApi against the packages
      # that were just packed, which is the only thing here that exercises it.
      - name: Verify package consumption
        run: ./build/verify-package-consumption.sh 0.0.0-ci
