name: Supabase Awake

# Keeps the Supabase project of Supabase Live from being paused. A project on the free plan is paused after a week
# without activity, and a paused project publishes no keys, so Supabase Live then fails before it tests anything
# ("No secret key for ..."). Every three days this asks the project's database one query through the Management API,
# and first restores the project when it was paused anyway, then waits until it is healthy again.
#
# Scheduled workflows run from the default branch only, so this one works once it is on main. Run it by hand
# (workflow_dispatch) to wake the project before a release.
#
# Needs what Supabase Live needs of the project: the secret SUPABASE_ACCESS_TOKEN (Project Settings read, Database
# read) and the variable SUPABASE_PROJECT_REF.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 */3 * *'

permissions:
  contents: read

jobs:
  awake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Wake the project, and ask its database one query
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Set the secret SUPABASE_ACCESS_TOKEN and the variable SUPABASE_PROJECT_REF."
            exit 1
          fi
          base="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF"
          api() { curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" "$@"; }
          status() { api "$base" | jq -r '.status'; }

          state=$(status)
          echo "The project is $state."
          if [ "$state" = "INACTIVE" ] || [ "$state" = "PAUSED" ]; then
            api -X POST "$base/restore" > /dev/null
            echo "::notice::The project was paused, and is being restored."
          fi

          # A restore takes a few minutes; ten at most before this gives up.
          for _ in $(seq 1 60); do
            state=$(status)
            [ "$state" = "ACTIVE_HEALTHY" ] && break
            sleep 10
          done
          if [ "$state" != "ACTIVE_HEALTHY" ]; then
            echo "::error::The project is $state after ten minutes, not healthy."
            exit 1
          fi

          api -X POST "$base/database/query" -d '{"query": "select 1"}' > /dev/null
          echo "The project is awake and its database answered."
