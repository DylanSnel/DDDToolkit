name: NuGet Release

on:
  release:
    types: [created]
  # A start by hand on main builds, tests and publishes the version, and then creates the tag and the GitHub
  # release. A release that GITHUB_TOKEN creates starts no other workflow, so this file does not run twice.
  workflow_dispatch:
    inputs:
      version:
        description: "The version without the v, such as 0.10.0"
        required: true
        type: string

jobs:
  publish-nuget:
    runs-on: ubuntu-latest

    # id-token lets the job ask GitHub for the token that trusted publishing trades for an API key.
    # Naming one permission drops the defaults, so the checkout's read access is named too.
    # contents: write lets a start by hand create the tag and the release at the end.
    permissions:
      contents: write
      id-token: write

    env:
      # Build and Test and Provider Tests both set this, and the release path needs it most. Without
      # it a container-backed test skips itself when Docker is missing and the run reports green
      # having proven nothing -- and here that green is what publishes to nuget.org. Set, every such
      # skip is a failure that names what could not be started. See RequiredContainers.
      DDDTOOLKIT_REQUIRE_CONTAINERS: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The package version comes from the tag, and everything published is permanent: nuget.org lets
      # you unlist a version but never reuse the number. A tag that yields the wrong version has to
      # fail here rather than after the push.
      - name: Extract release version
        id: get_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::A release by hand runs on main only, not on $GITHUB_REF."
              exit 1
            fi
            tag="v$INPUT_VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::The tag $tag exists already."
              exit 1
            fi
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          # Matched rather than stripped. ${tag#v} removes the v when it is there and silently leaves
          # the string alone when it is not, so a tag of the wrong shape would become a wrong version
          # instead of an error. Build metadata (+sha) is rejected too: NuGet ignores it when
          # comparing, so v3.0.0+a and v3.0.0+b are one package, and the second push would quietly
          # become a no-op under --skip-duplicate.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a release tag. Expected vMAJOR.MINOR.PATCH with an optional prerelease suffix, for example v3.0.0 or v3.0.0-rc.1."
            exit 1
          fi

          version="${tag#v}"
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $version from tag $tag"

      - name: Restore dependencies
        run: dotnet restore DDDToolkit.slnx

      - name: Build
        run: dotnet build DDDToolkit.slnx --no-restore --configuration Release -p:Version=${{ steps.get_version.outputs.VERSION }} -p:PackageVersion=${{ steps.get_version.outputs.VERSION }}

      # Unfiltered on purpose, unlike Build and Test. That job excludes the provider suite to stay at
      # about two minutes, because it runs on every push. This runs once per release, so the extra
      # few minutes to pull PostgreSQL and SQL Server buys the one thing worth having here: nothing
      # reaches nuget.org that has not been run against a real server. The example shop's samples are
      # the one exclusion: they test the examples, not a package, and Sample Tests runs them on every
      # pull request and every push to main. Sample Tests does not run on a release.
      - name: Test
        run: dotnet test DDDToolkit.slnx --no-build --configuration Release --filter "Category!=Samples"

      - name: Pack
        run: |
          for csproj in $(find ./Source -name '*.csproj'); do
            dotnet pack "$csproj" --configuration Release --no-build --output nupkgs -p:PackageVersion=${{ steps.get_version.outputs.VERSION }}
          done

      # The last thing before the push, and the reason it is here rather than only in Build and Test:
      # that job verifies consumption at 0.0.0-ci, which proves the packaging contract but not these
      # packages at this version. A broken package found here costs a re-run. Found after the push it
      # costs a version number, permanently.
      - name: Verify package consumption
        run: ./build/verify-package-consumption.sh ${{ steps.get_version.outputs.VERSION }}

      # Trusted publishing, so there is no API key in the repository's secrets to expire. nuget.org
      # checks this job's token against a policy naming this repository and this workflow file, so
      # renaming the file stops publishing until the policy follows. The key it hands back lives for an
      # hour, which is why it is asked for here, after the tests, and not at the start of the job. The
      # nuget.org organization DID-IT-Solutions owns the policy and the DylansTechStack.* packages. The
      # user is the nuget.org profile of a member of that organization, not an email address.
      - name: Log in to NuGet
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: DylanTheVillain

      - name: Publish to NuGet
        run: dotnet nuget push "./nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Create the tag and the GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.get_version.outputs.TAG }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/$TAG/CHANGELOG.md)."
