name: NuGet Release

on:
  release:
    types: [created]

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Extract release version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore DDDToolkit.slnx

      - name: Build
        run: dotnet build DDDToolkit.slnx --no-restore --configuration Release -p:PackageVersion=${{ steps.get_version.outputs.VERSION }}

      - name: Test
        run: dotnet test DDDToolkit.slnx --no-build --configuration Release

      - name: Pack
        run: |
          for csproj in $(find ./Source -name '*.csproj'); do
            dotnet pack "$csproj" --configuration Release --no-build --output nupkgs -p:PackageVersion=${{ steps.get_version.outputs.VERSION }}
          done

      - name: Publish to NuGet
        run: dotnet nuget push "./nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
