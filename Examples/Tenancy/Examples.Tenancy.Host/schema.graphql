"Defines when a policy shall be executed."
enum ApplyPolicy {
  "Before the resolver was executed."
  BEFORE_RESOLVER
  "After the resolver was executed."
  AFTER_RESOLVER
  "The policy is applied in the validation step before the execution."
  VALIDATION
}

enum ProjectRoleStatus {
  active
  archived
}

enum ProjectState {
  open
  closed
}

enum ProjectVia {
  crew
  organization
  system
}

enum RefusalKind {
  invalid
  not_permitted
  not_found
  conflict
}

enum RoleStatus {
  active
  archived
}

enum ScalarSerializationType {
  STRING
  BOOLEAN
  INT
  FLOAT
  OBJECT
  LIST
}

enum SeatStatus {
  active
  suspended
  deactivated
}

enum TenantShape {
  flat
  hierarchical
}

enum TenantStatus {
  provisioning
  active
  suspended
  closed
}

enum UnitStatus {
  active
  archived
}

"The `DateTime` scalar type represents a date and time with time zone offset information."
scalar DateTime
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/date-time.html")

"The `LocalDate` scalar type represents a date without time or time zone information."
scalar LocalDate
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/local-date.html")

"The `Long` scalar type represents a signed 64-bit integer."
scalar Long
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/long.html")

"The `UUID` scalar type represents a Universally Unique Identifier (UUID) as defined by RFC 9562."
scalar UUID
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/uuid.html")

directive @authorize(
  apply: ApplyPolicy! = BEFORE_RESOLVER
  policy: String
  roles: [String!]
) repeatable on OBJECT | FIELD_DEFINITION

directive @cost(weight: String!) on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | ENUM
  | INPUT_FIELD_DEFINITION

directive @defer(if: Boolean = true, label: String) on
  | FRAGMENT_SPREAD
  | INLINE_FRAGMENT
