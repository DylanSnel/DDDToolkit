  errors: [SeatDeactivateError!]
}

type SeatGrant {
  unitId: UUID!
  unitPath: String!
  roleId: UUID!
  role: String!
  startsAt: DateTime!
  endsAt: DateTime
  appliesNow: Boolean!
}

type SeatOfMine {
