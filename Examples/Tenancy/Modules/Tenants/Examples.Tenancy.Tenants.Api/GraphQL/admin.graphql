schema {
  query: Query
  mutation: Mutation
}

type Query {
  accessHistory(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
  ): AccessHistoryEntryConnection!
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  tenantAccessHistory(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    tenant: UUID!
  ): AccessHistoryEntryConnection!
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  seatGrants(seatId: UUID!): [SeatGrant!]! @cost(weight: "10")
  unitsWhereIHold(key: String!): HeldUnits! @cost(weight: "10")
  catalogue: Catalogue! @cost(weight: "10")
  openInvitations: [Invitation!]! @cost(weight: "10")
  tenants(after: String, size: Int): TenantDirectoryPage! @cost(weight: "10")
  organizationUnits: [OrganizationUnit!]! @cost(weight: "10")
  roles: [Role!]! @cost(weight: "10")
  overviewOfMine: SeatOverview! @cost(weight: "10")
  seatsOfMine: [SeatOfMine!]! @cost(weight: "10")
  seats: [Seat!]! @cost(weight: "10")
}

type Mutation {
  roleGrant(input: RoleGrantInput!): RoleGrantPayload! @cost(weight: "10")
  roleRevoke(input: RoleRevokeInput!): RoleRevokePayload! @cost(weight: "10")
  personInvite(input: PersonInviteInput!): PersonInvitePayload!
    @cost(weight: "10")
  invitationCancel(input: InvitationCancelInput!): InvitationCancelPayload!
    @cost(weight: "10")
  invitationAccept(input: InvitationAcceptInput!): InvitationAcceptPayload!
    @cost(weight: "10")
  organizationUnitAdd(input: OrganizationUnitAddInput!): OrganizationUnitAddPayload!
    @cost(weight: "10")
  organizationUnitMove(input: OrganizationUnitMoveInput!): OrganizationUnitMovePayload!
    @cost(weight: "10")
  organizationUnitArchive(input: OrganizationUnitArchiveInput!): OrganizationUnitArchivePayload!
    @cost(weight: "10")
  seatPlace(input: SeatPlaceInput!): SeatPlacePayload! @cost(weight: "10")
  placementWithdraw(input: PlacementWithdrawInput!): PlacementWithdrawPayload!
    @cost(weight: "10")
  roleCreate(input: RoleCreateInput!): RoleCreatePayload! @cost(weight: "10")
  roleKeysSet(input: RoleKeysSetInput!): RoleKeysSetPayload! @cost(weight: "10")
  roleArchive(input: RoleArchiveInput!): RoleArchivePayload! @cost(weight: "10")
  seatSuspend(input: SeatSuspendInput!): SeatSuspendPayload! @cost(weight: "10")
  seatReactivate(input: SeatReactivateInput!): SeatReactivatePayload!
    @cost(weight: "10")
  seatDeactivate(input: SeatDeactivateInput!): SeatDeactivatePayload!
    @cost(weight: "10")
  tenantShapeChange(input: TenantShapeChangeInput!): TenantShapeChangePayload!
    @cost(weight: "10")
}

type AccessHistoryEntry {
  bySeatId: UUID
  bySeat: Seat
  id: UUID!
  event: String!
  occurredAt: DateTime!
  byKind: String!
  details: String!
}

"A connection to a list of items."
type AccessHistoryEntryConnection {
  "A list of edges."
  edges: [AccessHistoryEntryEdge!]
  "A flattened list of the nodes"
  nodes: [AccessHistoryEntry!]
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "Identifies the total count of items in the connection."
  totalCount: Int! @cost(weight: "10")
}

type AccessHistoryEntryEdge {
  "The item at the end of the edge."
  node: AccessHistoryEntry!
  "A cursor for use in pagination."
  cursor: String!
}

"An aggregate that would have broken its own rules: one error for the command, with every rule that was broken in its violations. Its code, message and arguments are those of the first."
type BrokenRulesError implements CodedError {
  "The first rule that was broken, in the reader's language when the server has a translation for it, and in the domain's own words otherwise."
  message: String! @cost(weight: "10")
  "The code of the first rule that was broken."
  code: String!
  "The values the first violation's message was built from."
  arguments: [FailureArgument!]!
  "Every rule that was broken, in the order the aggregate reported them, never empty."
  violations: [RuleViolation!]!
}

type Catalogue {
  permissions: [Permission!]!
  packs: [RolePack!]!
  unitKinds: [UnitKind!]!
}

"A change that lost a race: somebody else changed the same thing after the caller read it, or the version the caller expected is not the one that is stored. Read again, and decide again."
type ConcurrencyConflictError implements CodedError {
  "What went wrong, in the reader's language when the server has a translation for it, and in the domain's own words otherwise."
  message: String! @cost(weight: "10")
  "Always \"concurrency-conflict\"."
  code: String!
  "Always empty."
  arguments: [FailureArgument!]!
}

"One of the values a message was built from, such as MaxLength and 40: its name, and its value as text."
type FailureArgument {
  "The value's name, as a translation's template spells it between braces."
  name: String!
  "The value as text: a string as it is, true or false, a number as JSON writes it, and anything else, such as an id, as its own text. Null when there was none."
  value: String
}

type GrantOfMine {
  roleId: UUID!
  role: String!
  startsAt: DateTime!
  endsAt: DateTime
  appliesNow: Boolean!
}

type HeldUnits {
  units: [UUID!]!
  wholeTenant: Boolean!
}

"A value that broke its own rules: one error for the command, with every reason in its failures. The value that was rejected is not sent back."
type InvalidValuesError implements CodedError {
  "What went wrong, in the reader's language when the server has a translation for it, and in the domain's own words otherwise."
  message: String! @cost(weight: "10")
  "Always \"invalid-value\". Each of the failures has the code of its own rule."
  code: String!
  "Always empty: the values are those of each failure."
  arguments: [FailureArgument!]!
  "Every reason the value was refused, never empty."
  failures: [ValueFailure!]!
}

type Invitation {
  unit: OrganizationUnit
  role: Role
  issuedBy: Seat
  until: DateTime
  id: UUID!
  address: String!
  displayName: String
  issuedAt: DateTime!
  expiresAt: DateTime!
}

type InvitationAcceptPayload {
  seatId: UUID
  errors: [InvitationAcceptError!]
}

type InvitationCancelPayload {
  invitationId: UUID
  errors: [InvitationCancelError!]
}

type IssuedInvitation {
  id: UUID!
  token: String!
  expiresAt: DateTime!
}

type KeyOfMine {
  key: String!
  wholeTenant: Boolean!
  grantedAt: [UnitPath!]!
  reaches: [UnitPath!]!
}

type OrganizationUnit @key(fields: "id") {
  id: UUID!
  parentId: UUID
  name: String
  kind: String
  status: UnitStatus
  path: String
  depth: Int
}

type OrganizationUnitAddPayload {
  organizationUnit: OrganizationUnit
  errors: [OrganizationUnitAddError!]
}

type OrganizationUnitArchivePayload {
  organizationUnit: OrganizationUnit
  errors: [OrganizationUnitArchiveError!]
}

type OrganizationUnitMovePayload {
  organizationUnit: OrganizationUnit
  errors: [OrganizationUnitMoveError!]
}

"A cursor that points to a specific page."
type PageCursor {
  "The page number."
  page: Int!
  "The cursor."
  cursor: String!
}

"Information about pagination in a connection."
type PageInfo {
  "Indicates whether more edges exist following the set defined by the clients arguments."
  hasNextPage: Boolean!
  "Indicates whether more edges exist prior the set defined by the clients arguments."
  hasPreviousPage: Boolean!
  "When paginating backwards, the cursor to continue."
  startCursor: String
  "When paginating forwards, the cursor to continue."
  endCursor: String
  "A list of cursors to continue paginating forwards."
  forwardCursors: [PageCursor!]!
  "A list of cursors to continue paginating backwards."
  backwardCursors: [PageCursor!]!
}

type Permission {
  key: String!
  module: String!
  description: String!
  implies: [String!]!
  retired: Boolean!
  managesAccess: Boolean!
}

type PersonInvitePayload {
  issuedInvitation: IssuedInvitation
  errors: [PersonInviteError!]
}

type PlacementOfMine {
  unit: UnitPath!
  isPrimary: Boolean!
  grants: [GrantOfMine!]!
}

type PlacementWithdrawPayload {
  seat: Seat
  errors: [PlacementWithdrawError!]
}

"A command that was refused before anything changed: the refusal's code, its kind, its message and the values the message was built from."
type RefusalError implements CodedError {
  "What went wrong, in the reader's language when the server has a translation for it, and in the domain's own words otherwise."
  message: String! @cost(weight: "10")
  "The rule that refused, stable across releases and languages: what a client branches on."
  code: String!
  "Which of the four answers it is, so a client tells \"not allowed\" from \"not found\" without a status code."
  kind: RefusalKind!
  "The input the refusal is about, where a form puts the message. Null for a refusal about the command as a whole."
  field: String
  "The values the message was built from, by name, so a client can phrase it itself."
  arguments: [FailureArgument!]!
}

type Role @key(fields: "id") {
  id: UUID!
  name: String
  fromPack: String
  status: RoleStatus
  keys: [String!] @authorize(policy: "tenancy.roles.manage")
  managesAccess: Boolean
}

type RoleArchivePayload {
  role: Role
  errors: [RoleArchiveError!]
}

type RoleCreatePayload {
  role: Role
  errors: [RoleCreateError!]
}

type RoleGrantPayload {
  seat: Seat
  errors: [RoleGrantError!]
}

type RoleKeysSetPayload {
  role: Role
  errors: [RoleKeysSetError!]
}

type RoleOfMine {
  id: UUID!
  name: String!
  fromPack: String
  status: RoleStatus!
  keys: [String!]!
  managesAccess: Boolean!
}

type RolePack {
  key: String!
  keys: [String!]!
  name: String!
  description: String!
  shape: TenantShape
  administers: Boolean!
}

type RoleRevokePayload {
  seat: Seat
  errors: [RoleRevokeError!]
}

"One broken rule, in a BrokenRulesError. A violation in a child entity says which child it was."
type RuleViolation {
  "What went wrong, in the reader's language when the server has a translation for it, and in the domain's own words otherwise."
  message: String! @cost(weight: "10")
  "The rule's code."
  code: String!
  "The type of the entity that reported the violation, when it said so."
  entity: String
  "The id of the entity that reported the violation, as text, so a violation in a child says which one."
  entityId: String
  "The values the message was built from, by name, so a client can phrase it itself."
  arguments: [FailureArgument!]!
}

type Seat @key(fields: "id") {
  id: UUID!
  displayName: String
  status: SeatStatus
}

type SeatDeactivatePayload {
