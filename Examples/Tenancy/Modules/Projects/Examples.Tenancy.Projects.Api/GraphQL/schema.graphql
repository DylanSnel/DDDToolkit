schema {
  query: Query
  mutation: Mutation
}

type Query {
  "Fetches an object given its ID."
  node("ID of the object." id: ID!): Node @lookup @shareable @cost(weight: "10")
  "Lookup nodes by a list of IDs."
  nodes("The list of node IDs." ids: [ID!]!): [Node]!
    @shareable
    @cost(weight: "10")
  projects(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    state: ProjectState
    unit: UUID
    text: String
  ): ProjectConnection!
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  keySets(keys: [String!]!, projects: [ID!]!): ProjectKeySets!
    @cost(weight: "10")
  tenantProjects(tenant: UUID!): [TenantProject!]! @cost(weight: "10")
  project(id: ID!): Project @lookup
  projectRoles: [ProjectRole!]! @cost(weight: "10")
}

type Mutation {
  crewMemberAdd(input: CrewMemberAddInput!): CrewMemberAddPayload!
    @cost(weight: "10")
  crewRoleGive(input: CrewRoleGiveInput!): CrewRoleGivePayload!
    @cost(weight: "10")
  crewRoleTake(input: CrewRoleTakeInput!): CrewRoleTakePayload!
    @cost(weight: "10")
  crewMemberRemove(input: CrewMemberRemoveInput!): CrewMemberRemovePayload!
    @cost(weight: "10")
  projectOpenAtUnit(input: ProjectOpenAtUnitInput!): ProjectOpenAtUnitPayload!
    @cost(weight: "10")
  projectRename(input: ProjectRenameInput!): ProjectRenamePayload!
    @cost(weight: "10")
  projectPlan(input: ProjectPlanInput!): ProjectPlanPayload! @cost(weight: "10")
  projectMove(input: ProjectMoveInput!): ProjectMovePayload! @cost(weight: "10")
  projectClose(input: ProjectCloseInput!): ProjectClosePayload!
    @cost(weight: "10")
  projectReopen(input: ProjectReopenInput!): ProjectReopenPayload!
    @cost(weight: "10")
  projectOwnerChange(input: ProjectOwnerChangeInput!): ProjectOwnerChangePayload!
    @cost(weight: "10")
  projectRoleCreate(input: ProjectRoleCreateInput!): ProjectRoleCreatePayload!
    @cost(weight: "10")
  projectRoleRename(input: ProjectRoleRenameInput!): ProjectRoleRenamePayload!
    @cost(weight: "10")
  projectRoleKeysSet(input: ProjectRoleKeysSetInput!): ProjectRoleKeysSetPayload!
    @cost(weight: "10")
  projectRoleArchive(input: ProjectRoleArchiveInput!): ProjectRoleArchivePayload!
    @cost(weight: "10")
}

"An aggregate that would have broken its own rules: one error for the command, with every rule that was broken in its violations. Its code, message and arguments are those of the first."
type BrokenRulesError implements CodedError @shareable {
  "The first rule that was broken, in the reader's language when the server has a translation for it, and in the domain's own words otherwise."
  message: String! @cost(weight: "10")
  "The code of the first rule that was broken."
  code: String!
  "The values the first violation's message was built from."
  arguments: [FailureArgument!]!
  "Every rule that was broken, in the order the aggregate reported them, never empty."
  violations: [RuleViolation!]!
}

type ChangedBy @shareable {
  kind: String!
  seat: UUID
}

"A change that lost a race: somebody else changed the same thing after the caller read it, or the version the caller expected is not the one that is stored. Read again, and decide again."
type ConcurrencyConflictError implements CodedError @shareable {
  "What went wrong, in the reader's language when the server has a translation for it, and in the domain's own words otherwise."
  message: String! @cost(weight: "10")
  "Always \"concurrency-conflict\"."
  code: String!
  "Always empty."
  arguments: [FailureArgument!]!
}

type CrewMember {
  seat: Seat
  roles: [CrewRoleHold!] @authorize(policy: "projects.crew.manage")
  isOwner: Boolean!
  startsAt: DateTime!
  endsAt: DateTime
  appliesNow: Boolean!
}

type CrewMemberAddPayload {
  project: Project
  errors: [CrewMemberAddError!]
}

type CrewMemberRemovePayload {
  project: Project
  errors: [CrewMemberRemoveError!]
}

type CrewRoleGivePayload {
  project: Project
  errors: [CrewRoleGiveError!]
}

type CrewRoleHold {
  role: ProjectRole
  startsAt: DateTime!
  endsAt: DateTime
  appliesNow: Boolean!
}

type CrewRoleTakePayload {
  project: Project
  errors: [CrewRoleTakeError!]
}

type DateRange @shareable {
  from: LocalDate!
  until: LocalDate!
}

"One of the values a message was built from, such as MaxLength and 40: its name, and its value as text."
type FailureArgument @shareable {
  "The value's name, as a translation's template spells it between braces."
  name: String!
  "The value as text: a string as it is, true or false, a number as JSON writes it, and anything else, such as an id, as its own text. Null when there was none."
  value: String
}

"A value that broke its own rules: one error for the command, with every reason in its failures. The value that was rejected is not sent back."
type InvalidValuesError implements CodedError @shareable {
  "What went wrong, in the reader's language when the server has a translation for it, and in the domain's own words otherwise."
  message: String! @cost(weight: "10")
  "Always \"invalid-value\". Each of the failures has the code of its own rule."
  code: String!
  "Always empty: the values are those of each failure."
  arguments: [FailureArgument!]!
  "Every reason the value was refused, never empty."
  failures: [ValueFailure!]!
}

type OrganizationUnit @key(fields: "id") {
  id: UUID!
}

"A cursor that points to a specific page."
type PageCursor @shareable {
  "The page number."
  page: Int!
  "The cursor."
  cursor: String!
}

"Information about pagination in a connection."
type PageInfo @shareable {
  "Indicates whether more edges exist following the set defined by the clients arguments."
  hasNextPage: Boolean!
  "Indicates whether more edges exist prior the set defined by the clients arguments."
  hasPreviousPage: Boolean!
  "When paginating backwards, the cursor to continue."
  startCursor: String
  "When paginating forwards, the cursor to continue."
  endCursor: String
  "A list of cursors to continue paginating forwards."
  forwardCursors: [PageCursor!]!
  "A list of cursors to continue paginating backwards."
  backwardCursors: [PageCursor!]!
}

type Project implements Node @key(fields: "id") {
  id: ID!
  unit: OrganizationUnit
  owner: Seat
  crew: [CrewMember!]
  myRoles: [ProjectRole!]
  can: ProjectAbilities
  version: Long
  name: String
  number: String
  state: ProjectState
  planned: DateRange
  via: ProjectVia
  changedBy: ChangedBy
}

type ProjectAbilities {
  rename: Boolean!
  plan: Boolean!
  move: Boolean!
  close: Boolean!
  reopen: Boolean!
  manageCrew: Boolean!
  changeOwner: Boolean!
}

type ProjectClosePayload {
  project: Project
  errors: [ProjectCloseError!]
}

"A connection to a list of items."
type ProjectConnection @shareable {
  "A list of edges."
  edges: [ProjectEdge!]
  "A flattened list of the nodes"
  nodes: [Project!]
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "Identifies the total count of items in the connection."
  totalCount: Int! @cost(weight: "10")
}

type ProjectEdge @shareable {
  "The item at the end of the edge."
  node: Project!
  "A cursor for use in pagination."
  cursor: String!
}

type ProjectKeySet {
  project: ID!
  keys: [String!]!
}

type ProjectKeySets {
  heldAtRoot: [String!]!
  onProjects: [ProjectKeySet!]!
}

type ProjectMovePayload {
  project: Project
  errors: [ProjectMoveError!]
}

type ProjectOpenAtUnitPayload {
  project: Project
  errors: [ProjectOpenAtUnitError!]
}

type ProjectOwnerChangePayload {
  project: Project
  errors: [ProjectOwnerChangeError!]
}

type ProjectPlanPayload {
  project: Project
  errors: [ProjectPlanError!]
}

type ProjectRenamePayload {
  project: Project
  errors: [ProjectRenameError!]
}

type ProjectReopenPayload {
  project: Project
  errors: [ProjectReopenError!]
}

type ProjectRole {
  id: UUID!
  name: String!
  description: String!
  madeFrom: String
  status: ProjectRoleStatus!
  keys: [String!] @authorize(policy: "tenancy.roles.manage")
}

type ProjectRoleArchivePayload {
  projectRole: ProjectRole
  errors: [ProjectRoleArchiveError!]
}

type ProjectRoleCreatePayload {
  projectRole: ProjectRole
  errors: [ProjectRoleCreateError!]
}

type ProjectRoleKeysSetPayload {
  projectRole: ProjectRole
  errors: [ProjectRoleKeysSetError!]
}

type ProjectRoleRenamePayload {
  projectRole: ProjectRole
  errors: [ProjectRoleRenameError!]
}

"A command that was refused before anything changed: the refusal's code, its kind, its message and the values the message was built from."
type RefusalError implements CodedError @shareable {
  "What went wrong, in the reader's language when the server has a translation for it, and in the domain's own words otherwise."
  message: String! @cost(weight: "10")
  "The rule that refused, stable across releases and languages: what a client branches on."
  code: String!
  "Which of the four answers it is, so a client tells \"not allowed\" from \"not found\" without a status code."
  kind: RefusalKind!
  "The input the refusal is about, where a form puts the message. Null for a refusal about the command as a whole."
  field: String
  "The values the message was built from, by name, so a client can phrase it itself."
  arguments: [FailureArgument!]!
}

"One broken rule, in a BrokenRulesError. A violation in a child entity says which child it was."
type RuleViolation @shareable {
  "What went wrong, in the reader's language when the server has a translation for it, and in the domain's own words otherwise."
  message: String! @cost(weight: "10")
  "The rule's code."
  code: String!
  "The type of the entity that reported the violation, when it said so."
  entity: String
  "The id of the entity that reported the violation, as text, so a violation in a child says which one."
  entityId: String
  "The values the message was built from, by name, so a client can phrase it itself."
  arguments: [FailureArgument!]!
}

type Seat @key(fields: "id") {
  id: UUID!
}

type TenantProject {
  id: ID!
  number: String!
  name: String!
  unitId: UUID!
  state: ProjectState!
  ownerSeat: UUID!
  planned: DateRange
  changedBy: ChangedBy!
}

"One reason a value was refused, in an InvalidValuesError."
type ValueFailure @shareable {
  "What went wrong, in the reader's language when the server has a translation for it, and in the domain's own words otherwise."
  message: String! @cost(weight: "10")
  "The rule's code, or \"Unspecified\" when the rule gave none."
  code: String!
  "The property the failure belongs to, or null when it is about the whole value."
  field: String
  "The values the message was built from, by name, so a client can phrase it itself."
  arguments: [FailureArgument!]!
}

"What every error in a mutation's payload has in common: a code to branch on, a message to show, and the values the message was built from."
interface CodedError {
  "What went wrong, in the reader's language when the server has a translation for it, and in the domain's own words otherwise."
  message: String!
  "The rule that said no, stable across releases and languages: what a client branches on."
  code: String!
  "The values the message was built from, by name, so a client can phrase it itself."
  arguments: [FailureArgument!]!
}

"Something that happened in the domain."
interface DomainEvent {
  "Unique, stable identifier of this occurrence. Use it for idempotent handling."
  eventId: UUID!
  "When the event occurred (UTC)."
  occurredAt: DateTime!
  "The runtime type name of the event."
  eventType: String!
}

"The node interface is implemented by entities that have a global unique identifier."
interface Node {
  id: ID!
}

union CrewMemberAddError =
  | RefusalError
  | InvalidValuesError
  | BrokenRulesError
  | ConcurrencyConflictError

union CrewMemberRemoveError =
  | RefusalError
  | InvalidValuesError
  | BrokenRulesError
  | ConcurrencyConflictError

union CrewRoleGiveError =
  | RefusalError
  | InvalidValuesError
  | BrokenRulesError
  | ConcurrencyConflictError

union CrewRoleTakeError =
  | RefusalError
  | InvalidValuesError
  | BrokenRulesError
  | ConcurrencyConflictError

union ProjectCloseError =
  | RefusalError
  | InvalidValuesError
  | BrokenRulesError
  | ConcurrencyConflictError

union ProjectMoveError =
  | RefusalError
  | InvalidValuesError
  | BrokenRulesError
  | ConcurrencyConflictError

union ProjectOpenAtUnitError =
  | RefusalError
  | InvalidValuesError
  | BrokenRulesError
  | ConcurrencyConflictError

union ProjectOwnerChangeError =
  | RefusalError
  | InvalidValuesError
  | BrokenRulesError
  | ConcurrencyConflictError

union ProjectPlanError =
  | RefusalError
  | InvalidValuesError
  | BrokenRulesError
  | ConcurrencyConflictError

union ProjectRenameError =
  | RefusalError
  | InvalidValuesError
  | BrokenRulesError
  | ConcurrencyConflictError

union ProjectReopenError =
  | RefusalError
  | InvalidValuesError
  | BrokenRulesError
  | ConcurrencyConflictError

union ProjectRoleArchiveError =
  | RefusalError
  | InvalidValuesError
  | BrokenRulesError
  | ConcurrencyConflictError

union ProjectRoleCreateError =
  | RefusalError
  | InvalidValuesError
  | BrokenRulesError
  | ConcurrencyConflictError

union ProjectRoleKeysSetError =
  | RefusalError
  | InvalidValuesError
  | BrokenRulesError
  | ConcurrencyConflictError

union ProjectRoleRenameError =
  | RefusalError
  | InvalidValuesError
  | BrokenRulesError
  | ConcurrencyConflictError

